name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality-checks:
    name: Quality Checks & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run ruff linter
      run: ruff check .
    
    - name: Run ruff formatter check
      run: ruff format --check .
    
    - name: Run mypy type checker (strict mode)
      run: mypy --strict src
    
    - name: Verify architecture layers (import-linter)
      run: lint-imports
    
    - name: Run domain and application tests
      run: pytest tests/domain tests/application -v
    
    - name: Run contract tests and adapter tests
      run: pytest tests/contracts tests/adapters -v
    
    - name: Run all tests with coverage (minimum 85%)
      run: pytest --cov=minidrive --cov-report=term-missing --cov-fail-under=85
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  packaging:
    name: Packaging wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Install wheel and smoke-test entry point
      run: |
        pip install --no-index --find-links dist minidrive
        minidrive --help
        minidrive ls
